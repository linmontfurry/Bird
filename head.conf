# Shared route-reflector cluster id. MUST be the exact same value on every
# core RR (us/hk/jp) so redundant reflection between them (a leaf multi-homed
# to more than one core) is recognized as the same cluster for loop
# prevention (RFC 4456). Leaf-only nodes never instantiate an rr-client
# session so this value is unused there, but it still has to be DEFINED
# (bird.conf's IBGP/IBGP2/ibgp_rr_client templates reference it even when
# unused) - every node's head.conf needs this line, same value everywhere.
define RR_CLUSTER_ID = 172.20.5.66;
