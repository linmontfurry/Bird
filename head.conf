# NEO_STRICT_ROA controls how NeoNetwork prefixes are authorized in
# roa_authorization() (bird.conf):
#   false (default, interim) - try real ROA first; if rpki4/rpki6 has no
#                               data for a neo prefix (ROA_UNKNOWN), fall
#                               back to trusting the origin ASN range
#                               4201270000-4201279999. Needed because no
#                               NeoNetwork RPKI feed is loaded yet.
#   true  (strict)          - disable that fallback; a neo prefix must have
#                              a real ROA_VALID hit or it is rejected, same
#                              as dn42. Flip this on once rpki4/rpki6 carry
#                              a trustworthy NeoNetwork ROA feed.
define NEO_STRICT_ROA = false;

