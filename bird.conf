include "/etc/bird/head.conf";

router id ROUTER_ID;
log syslog { warning, error };

roa4 table rpki4;
roa6 table rpki6;

protocol static dn42_safeguard4 {
	ipv4;
	route 172.31.0.0/16 unreachable;
	route 10.100.0.0/14 unreachable;
	route 10.127.0.0/16 unreachable;
}
protocol static dn42_safeguard6 {
	ipv6;
	route fd00::/8 unreachable;
}

# Placeholder routes so our own aggregates exist in BIRD's table and can be
# matched by is_self_export_net() / is_self_registered_net() below. They are
# never installed into the kernel FIB (see kernel4/kernel6 export filters).
protocol static {
	route SELF_PATH reject;
	route NEO_SELF_PATH reject;

	ipv4 {
		import all;
		export none;
	};
}
protocol static {
	route SELF_PATH_v6 reject;
	route NEO_SELF_PATH_v6 reject;

	ipv6 {
		import all;
		export none;
	};
}

protocol device device_default {
	scan time K_SCANINT;
}

protocol kernel kernel4 {
	scan time K_SCANINT;
	ipv4 {
		import none;
		export filter {
			if (source = RTS_STATIC) then reject;
			accept;
		};
	};
}
protocol kernel kernel6 {
	scan time K_SCANINT;
	ipv6 {
		import none;
		export filter {
			if (source = RTS_STATIC) then reject;
			accept;
		};
	};
}

protocol rpki rpki_rtr_akaere {
	roa4 { table rpki4; };
	roa6 { table rpki6; };
	retry keep 30;
	refresh keep 600;
	expire keep 86400;
	transport tcp;
	remote "rpki.akae.re" port 8082;
}

# ---------------------------------------------------------------------------
# Net classification helpers
# ---------------------------------------------------------------------------

function is_self_export_dn42_net() {
	case (net.type) {
	NET_IP4: return (net = SELF_PATH);
	NET_IP6: return (net = SELF_PATH_v6);
	}
}

function is_self_export_neo_net() {
	case (net.type) {
	NET_IP4: return (net = NEO_SELF_PATH);
	NET_IP6: return (net = NEO_SELF_PATH_v6);
	}
}

function is_self_export_net() {
	return (is_self_export_dn42_net() || is_self_export_neo_net());
}

function is_self_registered_net() {
	case (net.type) {
	NET_IP4: return (net ~ SELF_DN42_NET4 || net ~ SELF_NEO_NET4);
	NET_IP6: return (net ~ SELF_DN42_NET6 || net ~ SELF_NEO_NET6);
	}
}

function is_self_stale_net() {
	return (is_self_registered_net() && !is_self_export_net());
}

function is_dn42_net() {
	case (net.type) {
	NET_IP4: return (net ~ DN42_NET4);
	NET_IP6: return (net ~ DN42_NET6);
	}
}

function is_neo_net() {
	case (net.type) {
	NET_IP4: return (net ~ NEO_NET4);
	NET_IP6: return (net ~ NEO_NET6);
	}
}

function is_overlay_net() {
	return (is_dn42_net() || is_neo_net());
}

# NeoNetwork's 10.127.0.0/16 sits inside DN42's 10.0.0.0/8, so a plain
# is_dn42_net() also matches neo prefixes. Anything that needs a DN42-only
# view (dnix/dn42_only_* filters) must explicitly exclude the neo range.
function is_dn42_only_net() {
	return (is_dn42_net() && !is_neo_net());
}

function is_ospf_net() {
	case (net.type) {
	NET_IP4: return (net ~ OSPF_NET4);
	NET_IP6: return (net ~ OSPF_NET6);
	}
}

function is_safeguard_route() {
	case (net.type) {
	NET_IP4: return (net ~ [
		172.31.0.0/16{16,16},
		10.100.0.0/14{14,14},
		10.127.0.0/16{16,16}
	]);
	NET_IP6: return (net ~ [
		fd00::/8{8,8}
	]);
	}
}

function is_neo_origin() {
	return (bgp_path.last_nonaggregated >= 4201270000 &&
	        bgp_path.last_nonaggregated <= 4201279999);
}

function is_roa_valid() {
	case (net.type) {
	NET_IP4: return (roa_check(rpki4, net, bgp_path.last_nonaggregated) = ROA_VALID);
	NET_IP6: return (roa_check(rpki6, net, bgp_path.last_nonaggregated) = ROA_VALID);
	}
}

define ROA_AUTH_INVALID  = 0;
define ROA_AUTH_VALID    = 1;
define ROA_AUTH_FALLBACK = 2;

# rpki4/rpki6 (protocol rpki_rtr_akaere above) only carry DN42's ROA feed.
# NeoNetwork prefixes therefore come back ROA_UNKNOWN, never ROA_VALID, no
# matter how legitimate they are. Until a NeoNetwork ROA feed exists, a neo
# prefix is authorized by falling back to its origin ASN being inside
# NeoNetwork's registered range (see NEO_STRICT_ROA in head.conf).
function roa_authorization() {
	case (net.type) {
	NET_IP4: {
		if (roa_check(rpki4, net, bgp_path.last_nonaggregated) = ROA_VALID) then return ROA_AUTH_VALID;
		if (roa_check(rpki4, net, bgp_path.last_nonaggregated) = ROA_INVALID) then return ROA_AUTH_INVALID;
	}
	NET_IP6: {
		if (roa_check(rpki6, net, bgp_path.last_nonaggregated) = ROA_VALID) then return ROA_AUTH_VALID;
		if (roa_check(rpki6, net, bgp_path.last_nonaggregated) = ROA_INVALID) then return ROA_AUTH_INVALID;
	}
	}
	if (is_neo_net() && !NEO_STRICT_ROA && is_neo_origin()) then return ROA_AUTH_FALLBACK;
	return ROA_AUTH_INVALID;
}

function set_krt_prefsrc() {
	case (net.type) {
	NET_IP4:
		if (is_neo_net()) then {
			krt_prefsrc = NEO_ROUTER_ID;
		} else {
			krt_prefsrc = ROUTER_ID;
		}
	NET_IP6:
		if (is_neo_net()) then {
			krt_prefsrc = NEO_ROUTER_V6;
		} else {
			krt_prefsrc = ROUTER_V6;
		}
	}
}

function add_community_learnt() {
	bgp_community.delete([(64511, 0..39)]);
	bgp_community.add(COM_CRYPT_PFS);
	bgp_large_community.delete([(SELF_ASN, *, *)]);
	bgp_large_community.add(LC_LEARNT_NODE);
	bgp_large_community.add(LC_LEARNT_REGION);
	bgp_large_community.add(LC_LEARNT_COUNTRY);
}

function add_community_origin() {
	bgp_community.delete([(64511, 40..59)]);
	bgp_community.delete([(64511, 1000..1999)]);
	bgp_community.add(COM_ORIGIN_REGION);
	bgp_community.add(COM_ORIGIN_COUNTRY);
	bgp_large_community.delete([(SELF_ASN, *, *)]);
	bgp_large_community.add(LC_ORIGIN_NODE);
	bgp_large_community.add(LC_ORIGIN_REGION);
	bgp_large_community.add(LC_ORIGIN_COUNTRY);
}

function is_direct_connected() {
	int bgp_last_asn = 0;
	int bgp_path_len = 0;
	for int asn in bgp_path do {
		if (bgp_last_asn = 0 || bgp_last_asn != asn) then {
			bgp_path_len = bgp_path_len + 1;
			bgp_last_asn = asn;
		}
	}
	return (bgp_path_len = 1);
}

function translate_well_known_communities() {
	if (BGP_BLACKHOLE ~ bgp_community) then {
		bgp_community.delete([BGP_BLACKHOLE]);
		bgp_large_community.add(LC_ACT_BH_ALL);
	}
	if (BGP_NO_EXPORT ~ bgp_community) then {
		bgp_community.delete([BGP_NO_EXPORT]);
		bgp_large_community.add(LC_CTL_NO_EXPORT);
	}
	if (BGP_NO_ADVERTISE ~ bgp_community) then {
		bgp_community.delete([BGP_NO_ADVERTISE]);
		bgp_large_community.add(LC_CTL_NO_ADVERTISE);
	}
	if (BGP_LOCAL_AS ~ bgp_community) then {
		bgp_community.delete([BGP_LOCAL_AS]);
		bgp_large_community.add(LC_CTL_LOCAL_AS);
	}
}

function apply_smart_local_pref() {
	if (bgp_large_community ~ [LC_PREF_LOW]) then {
		bgp_local_pref = 80;
	} else if (bgp_large_community ~ [LC_PREF_HIGH]) then {
		bgp_local_pref = 220;
	} else if (is_direct_connected()) then {
		bgp_large_community.add(LC_ROUTE_DIRECT);
		bgp_local_pref = 200;
	} else if (bgp_community ~ [COM_ORIGIN_COUNTRY]) then {
		bgp_large_community.add(LC_ROUTE_SAME_COUNTRY);
		bgp_local_pref = 170;
	} else if (bgp_community ~ [COM_ORIGIN_REGION]) then {
		bgp_large_community.add(LC_ROUTE_SAME_REGION);
		bgp_local_pref = 150;
	} else {
		bgp_local_pref = 100;
	}
}

function reject_by_export_control() {
	if (bgp_large_community ~ [LC_CTL_NO_ADVERTISE]) then {
		return true;
	}
	if (bgp_large_community ~ [LC_CTL_NO_EXPORT, LC_CTL_LOCAL_AS]) then {
		return true;
	}
	return false;
}

function clean_internal_communities() {
	bgp_large_community.delete([
		LC_CTL_NO_EXPORT,
		LC_CTL_NO_ADVERTISE,
		LC_CTL_LOCAL_AS,
		LC_PREF_LOW,
		LC_PREF_HIGH,
		LC_ROUTE_DIRECT,
		LC_ROUTE_SAME_REGION,
		LC_ROUTE_SAME_COUNTRY
	]);
}

# Every eBGP session below auto-prepends its own configured "local as" to
# the AS_PATH on export - that's plain BGP protocol behaviour, BIRD does it
# for every route without any filter help. These two functions exist only
# to correct the ORIGIN AS for a self-originated prefix when the session's
# local-as doesn't match the identity that prefix should appear to
# originate from (a SELF_ASN-identity session self-announcing our NEO_SELF_PATH,
# or vice versa on a NEO_ASN-identity session). They must NOT be used for
# routes we are merely transiting - a transited route already has its true
# origin baked into its path, and the automatic per-session prepend is all
# that's needed there. (Calling one of these on a transited route would
# double-prepend our own ASN, silently inflating AS_PATH length on every
# route we pass on.)
function prepare_self_export() {
	add_community_learnt();
	add_community_origin();
	if (is_self_export_neo_net()) then {
		bgp_path.prepend(NEO_ASN);
	}
	clean_internal_communities();
}

function prepare_neo_self_export() {
	add_community_learnt();
	add_community_origin();
	if (is_self_export_dn42_net()) then {
		bgp_path.prepend(SELF_ASN);
	}
	clean_internal_communities();
}

# ---------------------------------------------------------------------------
# Import filters
# ---------------------------------------------------------------------------

filter dn42_import {
	if (!is_overlay_net()) then {
		reject;
	}
	if (is_safeguard_route()) then {
		reject;
	}
	if (is_self_stale_net()) then {
		reject;
	}
	if (is_self_export_net()) then {
		reject;
	}
	if (is_ospf_net()) then {
		reject;
	}
	add_community_learnt();
	translate_well_known_communities();
	int auth_status = roa_authorization();
	if (auth_status = ROA_AUTH_INVALID) then {
		bgp_large_community.add(LC_RPKI_INVALID);
		reject;
	}
	if (auth_status = ROA_AUTH_VALID) then {
		bgp_large_community.add(LC_RPKI_VALID);
	}
	if (bgp_large_community ~ [LC_ACT_BH_ALL, LC_ACT_BH_NODE]) then {
		ifname = "lo";
		accept;
	}
	set_krt_prefsrc();
	apply_smart_local_pref();
	accept;
}

filter dn42_only_import {
	if (!is_dn42_only_net()) then {
		reject;
	}
	if (is_safeguard_route()) then {
		reject;
	}
	if (is_self_stale_net()) then {
		reject;
	}
	if (is_self_export_net()) then {
		reject;
	}
	if (is_ospf_net()) then {
		reject;
	}
	add_community_learnt();
	translate_well_known_communities();
	if (!is_roa_valid()) then {
		bgp_large_community.add(LC_RPKI_INVALID);
		reject;
	}
	bgp_large_community.add(LC_RPKI_VALID);
	if (bgp_large_community ~ [LC_ACT_BH_ALL, LC_ACT_BH_NODE]) then {
		ifname = "lo";
		accept;
	}
	set_krt_prefsrc();
	apply_smart_local_pref();
	accept;
}

# ---------------------------------------------------------------------------
# Export filters
# ---------------------------------------------------------------------------

filter dn42_export {
	if (reject_by_export_control()) then reject;
	if (!is_overlay_net()) then {
		reject;
	}
	if (is_safeguard_route()) then reject;
	if (is_self_stale_net()) then reject;
	if (is_ospf_net()) then reject;
	if (is_self_export_net()) then {
		prepare_self_export();
		accept;
	}
	reject;
}

filter dn42_only_export {
	if (reject_by_export_control()) then reject;
	if (!is_dn42_only_net()) then {
		reject;
	}
	if (is_safeguard_route()) then reject;
	if (is_self_stale_net()) then reject;
	if (is_ospf_net()) then reject;
	if (is_self_export_net()) then {
		prepare_self_export();
		accept;
	}
	reject;
}

filter dn42_export_transit {
	if (reject_by_export_control()) then reject;
	if (!is_overlay_net()) then {
		reject;
	}
	if (is_safeguard_route()) then reject;
	if (is_self_stale_net()) then reject;
	if (is_ospf_net()) then reject;
	add_community_learnt();
	if (is_self_export_net()) then {
		prepare_self_export();
		accept;
	}
	if (source ~ [RTS_BGP]) then {
		clean_internal_communities();
		accept;
	}
	reject;
}

filter dn42_only_export_transit {
	if (reject_by_export_control()) then reject;
	if (!is_dn42_only_net()) then {
		reject;
	}
	if (is_safeguard_route()) then reject;
	if (is_self_stale_net()) then reject;
	if (is_ospf_net()) then reject;
	add_community_learnt();
	if (is_self_export_net()) then {
		prepare_self_export();
		accept;
	}
	if (source ~ [RTS_BGP]) then {
		clean_internal_communities();
		accept;
	}
	reject;
}

filter neo_export {
	if (reject_by_export_control()) then reject;
	if (!is_overlay_net()) then {
		reject;
	}
	if (is_safeguard_route()) then reject;
	if (is_self_stale_net()) then reject;
	if (is_ospf_net()) then reject;
	if (is_self_export_net()) then {
		prepare_neo_self_export();
		accept;
	}
	reject;
}

filter neo_export_transit {
	if (reject_by_export_control()) then reject;
	if (!is_overlay_net()) then {
		reject;
	}
	if (is_safeguard_route()) then reject;
	if (is_self_stale_net()) then reject;
	if (is_ospf_net()) then reject;
	add_community_learnt();
	if (is_self_export_net()) then {
		prepare_neo_self_export();
		accept;
	}
	if (source ~ [RTS_BGP]) then {
		clean_internal_communities();
		accept;
	}
	reject;
}

filter dn42_collector_export {
	if (!is_overlay_net()) then {
		reject;
	}
	if (is_safeguard_route()) then {
		reject;
	}
	if (is_self_stale_net()) then {
		reject;
	}
	if (is_ospf_net()) then {
		reject;
	}
	if (is_self_export_net()) then {
		if (source = RTS_STATIC) then {
			prepare_self_export();
			accept;
		}
		reject;
	}
	if (bgp_large_community ~ [LC_CTL_NO_EXPORT, LC_CTL_NO_ADVERTISE, LC_CTL_LOCAL_AS]) then {
		reject;
	}
	if (source ~ [RTS_BGP, RTS_PIPE]) then {
		clean_internal_communities();
		accept;
	}
	reject;
}

filter rr_redist {
	if (!is_overlay_net()) then {
		reject;
	}
	if (source ~ [RTS_OSPF] && is_ospf_net()) then {
		bgp_large_community.add(LC_CTL_NO_EXPORT);
		set_krt_prefsrc();
		accept;
	}
	if (is_safeguard_route()) then {
		reject;
	}
	if (is_self_stale_net()) then {
		reject;
	}
	if (source ~ [RTS_BGP]) then {
		set_krt_prefsrc();
		accept;
	}
	if (is_self_export_net()) then {
		prepare_self_export();
		set_krt_prefsrc();
		accept;
	}
	reject;
}

# ---------------------------------------------------------------------------
# Templates
#
# Template names below are load-bearing: every file under peers/, ebgp/,
# ibgp/, ospf/ (on this node and others) references one of these by name.
# Do not rename any of them - extend or fix their bodies in place instead.
# ---------------------------------------------------------------------------

template bgp peers {
	local as SELF_ASN;
	graceful restart on;
}

# dnpeers is the universal eBGP peer template: every current peer file
# (dn42-only and NeoNetwork alike, e.g. peers/neo1111.conf) attaches via
# "from dnpeers". Its filters (dn42_import / dn42_export_transit) already
# handle both address families correctly, so peers do not need a separate
# neo-specific template to interoperate.
template bgp dnpeers from peers {
	ipv4 {
		extended next hop on;
		import filter dn42_import;
		export filter dn42_export_transit;
		import limit 20000;
		export limit 20000;
	};
	ipv6 {
		extended next hop on;
		import filter dn42_import;
		export filter dn42_export_transit;
		import limit 20000;
		export limit 20000;
	};
}

template bgp dnnoneo from dnpeers {
}

template bgp fullpeers from dnpeers {
}

template bgp onlydnpeers from dnpeers {
}

template bgp dnix from peers {
	local role rs_client;
	enable extended messages on;
	direct;

	bfd {
		min rx interval 1000 ms;
		min tx interval 1000 ms;
		multiplier 3;
	};

	ipv4 {
		extended next hop on;
		import filter dn42_import;
		export filter dn42_export;
		import limit 20000;
		export limit 20000;
		add paths rx;
	};

	ipv6 {
		extended next hop on;
		import filter dn42_import;
		export filter dn42_export;
		import limit 20000;
		export limit 20000;
		add paths rx;
	};
}

template bgp neopeers from dnpeers {
	local as NEO_ASN;

	ipv4 {
		extended next hop on;
		import filter dn42_import;
		export filter neo_export_transit;
		import limit 20000;
		export limit 20000;
	};

	ipv6 {
		extended next hop on;
		import filter dn42_import;
		export filter neo_export_transit;
		import limit 20000;
		export limit 20000;
	};
}

template bgp neoix from dnix {
	local as NEO_ASN;

	ipv4 {
		extended next hop on;
		import filter dn42_import;
		export filter neo_export;
		import limit 20000;
		export limit 20000;
		add paths rx;
	};

	ipv6 {
		extended next hop on;
		import filter dn42_import;
		export filter neo_export;
		import limit 20000;
		export limit 20000;
		add paths rx;
	};
}

template bgp igp_set from peers {
	neighbor as SELF_ASN;
	ipv4 { extended next hop on; next hop self; import filter rr_redist; export filter rr_redist; };
	ipv6 { extended next hop on; next hop self; import filter rr_redist; export filter rr_redist; };
}

template bgp ibgp_out from peers {
	neighbor as SELF_ASN;
	direct;
	ipv4 {
		next hop self;
		import filter rr_redist;
		export filter rr_redist;
	};

	ipv6 {
		next hop self;
		import filter rr_redist;
		export filter rr_redist;
	};
}

template bgp IBGP from igp_set {
	rr client;
	rr cluster id RR_CLUSTER_ID;
}

template bgp IBGP2 from ibgp_out {
	rr client;
	rr cluster id RR_CLUSTER_ID;
}

template bgp ibgp_rr_base from peers {
	neighbor as SELF_ASN;
	multihop 10;
	source address LOOP_NET4;

	ipv4 {
		extended next hop on;
		next hop self;
		import filter rr_redist;
		export filter rr_redist;
		import limit 20000;
		export limit 20000;
	};

	ipv6 {
		next hop self;
		import filter rr_redist;
		export filter rr_redist;
		import limit 20000;
		export limit 20000;
	};
}

template bgp ibgp_rr_client from ibgp_rr_base {
	rr client;
	rr cluster id RR_CLUSTER_ID;
}

template bgp ibgp_rr_peer from ibgp_rr_base {
}

include "/etc/bird/peers/*.conf";
include "/etc/bird/ebgp/*.conf";
include "/etc/bird/ibgp/*.conf";
include "/etc/bird/ospf/*.conf";
